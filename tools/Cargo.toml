[workspace]
resolver = "3"
members = ["zendiloos-catalog", "catalog"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
zendiloos-catalog = { path = "zendiloos-catalog" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
