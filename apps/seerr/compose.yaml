services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    init: true
    environment:
      TZ: ${TZ}
    ports:
      - ${PORT_WEB}:5055
    volumes:
      - ${APP_DATA}/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
