services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      PARSER_HOST: parser
      PARSER_PORT: 5000
    ports:
      - ${PORT_WEB}:6868
    volumes:
      - ${APP_DATA}/config:/config
    depends_on:
      parser:
        condition: service_healthy

  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest
    restart: unless-stopped
